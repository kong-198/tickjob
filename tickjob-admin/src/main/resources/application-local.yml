# ============================================================
# local：零依赖启动
#
# 用 H2 内存库 + 内嵌一个本地执行器，clone 下来直接 run 就能看到
# 「任务被真实触发 → 执行器执行 → 结果回写日志」的完整链路。
# ============================================================
spring:
  datasource:
    # MODE=MySQL 让 H2 认 MySQL 语法，方便本地和线上共用一套 SQL 习惯
    url: jdbc:h2:mem:tickjob;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

tickjob:
  executor:
    # 调度中心内嵌一个执行器实例，仅用于演示。
    # 生产环境应当把执行器部署为独立进程，并把这里关掉（enabled: false）。
    enabled: true
    app-name: tickjob-demo
    admin-addresses:
      - http://127.0.0.1:8080
    port: 9999
    registry-interval-seconds: 15
    max-handler-threads: 50

logging:
  level:
    com.kong.tickjob: INFO
